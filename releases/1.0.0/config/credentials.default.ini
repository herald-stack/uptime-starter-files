# credentials.default.ini - Template for monitor credentials. Save as credentials.ini.
#
# Login credentials for HTTP monitors that need basic authentication. Nothing here is used until
# a credential is defined below and a monitor in monitors.yaml names it.
#
# Each credential is a section named with a label of your choice (unique, not case
# sensitive, not blank, and with no space at either end), holding a username and a
# password. Both lines are required. A value may be left empty on purpose, as in
# "password =", for services that take an API key as the username and require no password.
#
# To use a credential, name its label in the monitor, in monitors.yaml:
#
#   - name: "Wiki admin"
#     type: http
#     url: "https://wiki.example.local/admin"
#     credentials: "wiki-login"
#
# Several monitors can use the same credential. Use an https:// url where you can: over
# plain http:// the credential is sent unencrypted (it is allowed, and logged as a
# warning). Do not put a username or password in a monitor's url. The password is not
# shown on the dashboard or saved with the check results.
#
# Values are used exactly as written after the equals sign, so a password can contain
# spaces, quotes, #, ;, %, $ and further equals signs. Comments are whole lines starting
# with #. Spaces at the start or end of a value are ignored.
#
# This file holds passwords. Keep it out of version control and do not share it. It must
# be readable by the user the container runs as. Changes to it are picked up within about
# a minute, with no restart.
#
# Example (remove the # from each line to use it):
#
# [wiki-login]
# username = your-username-here
# password = your-password-here
